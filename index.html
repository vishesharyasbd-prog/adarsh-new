<script>
(function () {

  const button = document.getElementById('joinTelegram');
  const telegramURL = 'https://t.me/+i0CF4kU9VpRhOWQ1';

  let subscribeSent = false;

  button.addEventListener('click', function(event) {

    event.preventDefault();

    // Prevent duplicate events
    if (subscribeSent) return;

    subscribeSent = true;

    button.classList.add('processing');
    button.textContent = 'CONNECTING...';

    // MANUAL META SUBSCRIBE EVENT
    if (typeof window.fbq === 'function') {
      window.fbq('track', 'Subscribe');
    }

    // Allow Pixel time to send the event
    setTimeout(function() {
      window.location.assign(telegramURL);
    }, 1000);

  });

})();
